tools:
- name: search_dashboard
  description: 'Interactive dashboard variant of `search`: returns summary metrics, a source breakdown
    chart, and a results table with a click-to-expand detail panel, all rendered in the conversation.
    Same params as `search`. Use for a richer visual overview of a query''s results. Automatically selects
    an engine-specific dashboard when available (e.g. google_flights gets price intelligence charting).'
- name: search_table
  description: 'Interactive UI variant of `search`: returns organic results as a sortable, searchable
    table rendered in the conversation. Same params as `search`. Use when the host supports MCP Apps and
    the user wants to browse results visually rather than read JSON.'
- name: search
  description: "Universal search tool supporting all SerpApi engines and result types.\n\n    When to\
    \ use:\n        - Any query needing live, structured SERP data: web results, news, product listings,\
    \ job postings, local businesses, flight/hotel prices, video results, images, stock/weather cards,\
    \ knowledge graph entities.\n    \n    Engine discovery via MCP resources:\n        - serpapi://engines\
    \ lists all engines supported by this tool.\n        - serpapi://engines/<engine> provides engine-specific\
    \ parameters and supported options.\n        - Example: serpapi://engines/google_news\n\n    Input\
    \ schema:\n        params: JSON object containing SerpApi engine parameters.\n            Common parameters:\n\
    \                - q: Search query. Required for most engines.\n                - engine: SerpApi\
    \ engine name. Defaults to \"google_light\".\n                - location: Optional geographic location\
    \ for localized results.\n                - output: Optional response format. Omit for JSON (default),\
    \ or set to \"md\" for Markdown.\n    \n            Engine-specific parameters are available via MCP\
    \ resources:\n                - serpapi://engines lists all supported engines.\n                -\
    \ serpapi://engines/<engine> provides parameters and options for one engine.\n    \n        mode:\
    \ Response mode. Defaults to \"complete\".\n            - \"complete\": Return the full SerpApi response.\n\
    \            - \"compact\": Remove metadata fields from JSON responses. Markdown is returned unchanged.\n\
    \    \n    Output schema:\n        structuredContent.result contains the response string: serialized\
    \ JSON or unchanged Markdown.\n        The same string is included in text content. Tool failures\
    \ preserve this wrapper and set isError to true.\n\n    Guided search:\n        Searches can request\
    \ missing engine parameters from supporting clients using the engine catalog and engine-specific rules.\n\
    \        Flights collect airports and dates, hotels collect the destination and stay dates, and directions\
    \ collect missing endpoints.\n        Other clients receive a missing-parameter error. Cancellation\
    \ does not run a search.\n\n    Examples:\n        Weather: {\"params\": {\"q\": \"weather in London\"\
    , \"engine\": \"google\"}, \"mode\": \"complete\"}\n        Stock: {\"params\": {\"q\": \"AAPL stock\"\
    , \"engine\": \"google\"}, \"mode\": \"complete\"}\n        General: {\"params\": {\"q\": \"coffee\
    \ shops\", \"engine\": \"google_light\", \"location\": \"Austin, TX\"}, \"mode\": \"complete\"}\n\
    \        Compact: {\"params\": {\"q\": \"news\"}, \"mode\": \"compact\"}\n        Markdown: {\"params\"\
    : {\"q\": \"news\", \"output\": \"md\"}}\n\n    Supported engines include (not limited to):\n    \
    \    - google\n        - google_light\n        - google_flights\n        - google_hotels\n       \
    \ - google_images\n        - google_news\n        - google_local\n        - google_shopping\n    \
    \    - google_jobs\n        - bing\n        - yahoo\n        - duckduckgo\n        - youtube_search\n\
    \        - baidu\n        - ebay"
